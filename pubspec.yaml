name: trip_management
description: Trip itinerary and planning app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_ui:
    path: ../../packages/shared/shared_ui
  shared_logging:
    path: ../../packages/shared/shared_logging
  supabase_flutter: ^2.9.0
  flutter_secure_storage: ^9.2.4
  go_router: ^14.6.2
  provider: ^6.1.2
  http: ^1.4.0
  intl: ^0.20.2
  web: ^1.1.1
  flutter_slidable: ^3.1.1
  google_maps_flutter: ^2.9.0
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
