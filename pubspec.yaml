name: trip_management
description: Trip itinerary and planning app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_ui:
    path: ../../packages/shared/shared_ui
  shared_logging:
    path: ../../packages/shared/shared_logging
  supabase_flutter: ^2.9.0
  flutter_secure_storage: ^9.2.4
  go_router: ^14.6.2
  provider: ^6.1.2
  http: ^1.4.0
  intl: ^0.20.2
  web: ^1.1.1
  flutter_slidable: ^3.1.1
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.0
  image_picker: ^1.1.2
  phone_form_field: ^10.0.17
  firebase_core: ^3.6.0
  firebase_messaging: ^15.0.0
  local_auth: ^2.3.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  flutter_contacts: ^2.2.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.13.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
